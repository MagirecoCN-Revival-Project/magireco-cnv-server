<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>注册 · 魔法纪录复兴计划</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: linear-gradient(135deg, #e2f0ff 0%, #d8f7f0 55%, #f0fbfb 100%); background-attachment: fixed; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ui.jsx"></script>
<!-- 面板注入业务节点 API 基址(window.MR_API_BASE);同源部署时此文件可缺省 -->
<script src="/app-config.js"></script>
<script src="api.jsx"></script>
<script type="text/babel" src="auth-common.jsx"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function passwordStrength(pwd) {
  let score = 0;
  if (pwd.length >= 8) score++;
  if (pwd.length >= 12) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/\d/.test(pwd)) score++;
  if (/[^a-zA-Z0-9]/.test(pwd)) score++;
  if (score >= 5) return { label: "极强", pct: 100, color: "var(--teal-600)" };
  if (score >= 4) return { label: "较强", pct: 80,  color: "var(--teal-500)" };
  if (score >= 3) return { label: "中等", pct: 60,  color: "var(--accent-600)" };
  if (score >= 2) return { label: "较弱", pct: 40,  color: "var(--amber-500)" };
  return { label: "很弱", pct: pwd ? 20 : 0, color: "var(--red-500)" };
}

function RegisterPage() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [agreed, setAgreed] = useState(false);
  const [capStatus, setCapStatus] = useState("idle");
  const [capToken, setCapToken] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const toast = useToast();

  const strength = useMemo(() => passwordStrength(password), [password]);
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const matches = password && password === confirm;

  const submit = async (e) => {
    e?.preventDefault();
    if (!emailOk) { setError("邮箱格式不正确"); return; }
    if (strength.pct < 60) { setError("密码强度不足,请使用更复杂的密码"); return; }
    if (!matches) { setError("两次输入的密码不一致"); return; }
    if (!agreed) { setError("请阅读并同意用户协议"); return; }
    if (capStatus !== "verified" || !capToken) { setError("请先完成人机验证"); return; }
    setError("");
    setSubmitting(true);
    try {
      const res = await Api.post("/auth/register", { email, password, cap_token: capToken });
      if (res.token) Api.setToken(res.token);
      toast("注册成功！请验证邮箱以启用所有功能", "ok");
      setTimeout(() => { window.location.href = "verify-email.html"; }, 500);
    } catch (err) {
      setError(err.message || "注册失败");
      setCapStatus("idle");
      setCapToken("");
      setSubmitting(false);
    }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-brand">
          <div className="auth-brand-mark">魔</div>
          <div>
            <div className="auth-brand-text">魔法纪录复兴计划</div>
            <div className="auth-brand-sub">magireco-revival.cn</div>
          </div>
        </div>
        <div className="auth-title">注册</div>
        <div className="auth-sub">使用邮箱作为登录用户名 · 注册后验证邮箱即可开始游戏</div>

        <form className="auth-form" onSubmit={submit}>
          <div className="field">
            <label className="field-label">
              邮箱(将作为登录用户名)
              {email && (emailOk
                ? <span style={{ marginLeft: "auto", color: "var(--teal-600)", fontSize: 11.5 }}><I.Check size={11}/> 格式正确</span>
                : <span style={{ marginLeft: "auto", color: "var(--red-500)", fontSize: 11.5 }}>格式不正确</span>
              )}
            </label>
            <input className="input" type="email" autoFocus placeholder="you@example.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}/>
            <div className="field-hint">注册成功后将向此邮箱发送验证码，验证后方可使用云存档</div>
          </div>

          <div className="field">
            <label className="field-label">
              密码
              {password && (
                <span style={{ marginLeft: "auto", fontSize: 11.5, color: strength.color, fontWeight: 500 }}>{strength.label}</span>
              )}
            </label>
            <input className="input mono" type="password" placeholder="至少 8 位,推荐 12 位以上"
              value={password} onChange={(e) => setPassword(e.target.value)}/>
            <div className="progress" style={{ height: 4, marginTop: 4 }}>
              <div style={{ width: `${strength.pct}%`, background: strength.color }}/>
            </div>
            <div className="field-hint">建议包含大小写字母、数字和符号</div>
          </div>

          <div className="field">
            <label className="field-label">
              确认密码
              {confirm && (matches
                ? <span style={{ marginLeft: "auto", color: "var(--teal-600)", fontSize: 11.5 }}><I.Check size={11}/> 一致</span>
                : <span style={{ marginLeft: "auto", color: "var(--red-500)", fontSize: 11.5 }}>不一致</span>
              )}
            </label>
            <input className="input mono" type="password" placeholder="再次输入密码"
              value={confirm} onChange={(e) => setConfirm(e.target.value)}/>
          </div>

          <CapWorkerWidget status={capStatus} onVerify={(s, t) => { setCapStatus(s); setCapToken(t || ""); }}/>

          <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12, color: "var(--text-2)", lineHeight: 1.5 }}>
            <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)}
              style={{ width: 14, height: 14, accentColor: "var(--accent-600)", marginTop: 3, flexShrink: 0 }}/>
            <span>
              我已阅读并同意 <a href="#" onClick={(e) => e.preventDefault()} style={{ color: "var(--accent-700)", textDecoration: "none" }}>《用户协议》</a> 与 <a href="#" onClick={(e) => e.preventDefault()} style={{ color: "var(--accent-700)", textDecoration: "none" }}>《隐私政策》</a>
            </span>
          </label>

          {error && (
            <div style={{
              padding: "8px 12px", borderRadius: 6,
              background: "var(--red-50)", border: "1px solid rgba(220,38,38,0.3)",
              color: "var(--red-500)", fontSize: 12.5,
              display: "flex", alignItems: "center", gap: 8,
            }}>
              <I.Alert size={13}/>{error}
            </div>
          )}

          <button type="submit" className="btn btn-primary" disabled={submitting}
            style={{ justifyContent: "center", padding: "10px 14px", fontSize: 13, marginTop: 4 }}>
            {submitting
              ? <><span style={{ width: 12, height: 12, border: "2px solid #fff", borderTopColor: "transparent", borderRadius: "50%", display: "inline-block", animation: "spin 0.6s linear infinite" }}/> 注册中…</>
              : "创建账号"}
          </button>
        </form>

        <div className="auth-foot">
          已有账号? <a href="login.html">直接登录</a>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ToastProvider><RegisterPage/></ToastProvider>);
</script>
</body>
</html>
